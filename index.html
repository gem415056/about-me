<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ABOUT ME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 모바일 메인 뷰포트 컨테이너 -->
  <div id="app-container">
    <!-- 헤더 1 (글로벌 상단 고정 헤더) -->
    <header id="header-1" class="app-header header-1 hidden">
      <button type="button" id="btn-open-left-drawer" class="icon-btn" aria-label="메뉴 열기">
        <!-- 추후 사용자 지정 SVG로 교체 예정: 임시 햄버거 아이콘 -->
        <span class="icon-placeholder">☰</span>
      </button>
      <h1 id="header-title" class="header-title">ABOUT ME</h1>
      <div class="header-right-space"></div>
    </header>

    <!-- 헤더 2 (명리학 전용 보조 헤더) -->
    <header id="header-2" class="app-header header-2 hidden">
      <span class="sub-header-title">명리학으로 알아보기</span>
      <button type="button" id="btn-toggle-saju-drawer" class="accordion-header-btn">
        <span class="btn-text">명식 선택하기</span>
        <span id="saju-drawer-arrow" class="accordion-arrow">▼</span>
      </button>
    </header>

    <!-- 메인 동적 화면 전환 영역 -->
    <main id="main-content">
      <!-- 1. 랜딩 화면 섹션 -->
      <section id="view-landing" class="view-section active">
        <div class="landing-container">
          <div class="landing-header">
            <h1 class="landing-title">𝘼𝘽𝙊𝙐𝙏 𝙈𝙀</h1>
            <p class="landing-subtitle">나를 깊이 이해하는 두 가지 여정</p>
          </div>
          
          <div class="landing-actions">
            <button type="button" id="btn-start-psychology" class="landing-btn">
              <div class="btn-content">
                <span class="btn-main-title">심리학으로 알아보기</span>
                <span class="btn-sub-desc">대화를 통한 내면과 무의식 심리 탐색</span>
              </div>
              <span class="btn-arrow">→</span>
            </button>

            <button type="button" id="btn-start-saju" class="landing-btn">
              <div class="btn-content">
                <span class="btn-main-title">명리학으로 알아보기</span>
                <span class="btn-sub-desc">만세력과 사주 원국 심층 분석</span>
              </div>
              <span class="btn-arrow">→</span>
            </button>
          </div>
        </div>
      </section>

      <!-- 2. 심리학 검사 대화방 섹션 -->
      <section id="view-psychology" class="view-section hidden"></section>

      <!-- 3. 명리학 분석 대화방 섹션 -->
      <section id="view-saju" class="view-section hidden"></section>
    </main>

    <!-- 배경 암전(Dim Layer) 오버레이 -->
    <div id="backdrop-overlay" class="backdrop-overlay hidden"></div>

    <!-- 좌측 글로벌 서랍 메뉴 컨테이너 -->
    <aside id="left-drawer" class="drawer-container drawer-left" aria-hidden="true">
      <div class="drawer-content">
        <!-- 1. 심리학 대화 기록 섹션 -->
        <section class="drawer-section">
          <div class="drawer-section-header">
            <span class="drawer-section-title">심리학 대화 기록</span>
            <button type="button" id="btn-new-psychology-chat" class="drawer-text-btn">+ 새 대화</button>
          </div>
          <div id="psychology-chat-list" class="drawer-list-scroll">
            <div class="empty-list-notice">기록된 대화가 없습니다.</div>
          </div>
        </section>

        <div class="drawer-divider"></div>

        <!-- 2. 명리학 대화 기록 섹션 -->
        <section class="drawer-section">
          <div class="drawer-section-header">
            <span class="drawer-section-title">명리학 대화 기록</span>
            <button type="button" id="btn-new-saju-chat" class="drawer-text-btn">+ 새 대화</button>
          </div>
          <div id="saju-chat-list" class="drawer-list-scroll">
            <div class="empty-list-notice">기록된 대화가 없습니다.</div>
          </div>
        </section>

        <!-- 3. 하단 툴바 (프롬프트, API설정, 백업, 복원) -->
        <div class="drawer-bottom-toolbar">
          <button type="button" id="btn-open-prompts-modal" class="toolbar-btn" title="프롬프트 설정">
            <span class="toolbar-icon">✎</span>
            <span class="toolbar-label">프롬프트</span>
          </button>
          <button type="button" id="btn-open-api-modal" class="toolbar-btn" title="API 및 설정">
            <span class="toolbar-icon">⚙</span>
            <span class="toolbar-label">설정</span>
          </button>
          <button type="button" id="btn-cloud-backup" class="toolbar-btn" title="클라우드 백업">
            <span class="toolbar-icon">☁↑</span>
            <span class="toolbar-label">백업</span>
          </button>
          <button type="button" id="btn-cloud-restore" class="toolbar-btn" title="클라우드 복원">
            <span class="toolbar-icon">☁↓</span>
            <span class="toolbar-label">복원</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 우측 명식 서랍 메뉴 컨테이너 -->
    <aside id="right-saju-drawer" class="drawer-container drawer-right"></aside>

    <!-- 공통 팝업/모달 레이어 컨테이너 -->
    <div id="modal-container" class="modal-layer hidden"></div>

    <!-- 전체화면 최종 분석 보고서 오버레이 -->
    <div id="report-fullscreen-view" class="report-fullscreen hidden"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
